services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_PASSWORD: studio, POSTGRES_DB: studio}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studio"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  api:
    build: ./backend
    env_file: [{path: .env, required: false}]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:studio@db/studio
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data
      PIPER_VOICES_DIR: /voices
    # ./voices is writable: narrator voices are downloaded into it once and kept across rebuilds
    volumes: [media:/data, ./comfyui:/workflows:ro, ./voices:/voices]
    ports: ["8000:8000"]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: ./backend
    env_file: [{path: .env, required: false}]
    # one worker container per host: on start it re-queues renders its predecessor was running
    command: celery -A app.worker worker -Q default,render --concurrency 2 --loglevel info
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:studio@db/studio
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data
      PIPER_VOICES_DIR: /voices
    # ./voices is writable: narrator voices are downloaded into it once and kept across rebuilds
    volumes: [media:/data, ./comfyui:/workflows:ro, ./voices:/voices]
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  web:
    build:
      context: ./frontend
      # empty = the app calls its API on the same web address (through "site" below)
      args: {NEXT_PUBLIC_API_URL: ""}
    restart: unless-stopped
    depends_on: [api]
  # Front door: http://localhost:3000 serves the app and sends /api to the backend.
  site:
    image: caddy:2.8.4-alpine
    env_file: [{path: .env, required: false}]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data]
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on: [web, api]
  # Optional free public link from this PC (Cloudflare quick tunnel, no account needed).
  # Start:  docker compose --profile online up -d
  # Link:   docker compose logs tunnel   (look for https://....trycloudflare.com)
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [online]
    command: tunnel --no-autoupdate --url http://site:3000
    restart: unless-stopped
    depends_on: [site]
volumes:
  pgdata:
  media:
  caddy:
